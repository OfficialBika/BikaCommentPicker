name: V2 Pro CI
on:
  push:
    branches: [v2-pro, v2-pro-hardening-2026-10-24, v2-pro-approved-groups-2026-10-24, v2-pro-production-hardening-2026-10-24]
  pull_request:
    branches: [v2-pro]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm test
